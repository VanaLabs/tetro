[workspace]
resolver = "2"
members = [
    "frontend/src-tauri",
    "llama-helper"
]

# Shared workspace settings
[workspace.package]
edition = "2021"
rust-version = "1.77"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }

# Preserve the pinned engine API while fixing Metal builds in paths with spaces.
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

# macOS 27 rejects some stripped proc-macro dylibs during release builds.
[profile.release.build-override]
strip = "none"
