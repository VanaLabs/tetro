name: Suggest an improvement
description: Describe what you would like to change.
body:
  - type: markdown
    attributes:
      value: |
        This post will be public. Please leave out recordings, transcripts and private information. You can reply to follow-up questions here.
  - type: textarea
    id: suggestion
    attributes:
      label: What would you like to change?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: What would this help you do?
  - type: input
    id: app-version
    attributes:
      label: Tetro version
      description: You can find this in About Tetro. Leave it blank if you are not sure.
